<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パンクちゃん リリィ</title>
<meta name="description" content="パンクちゃん デビューシングル「リリィ」配信中。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* One visual world: the night cathedral of the MV. Journey first, then artist, MV, release. */
  --navy: #0b1622;
  --navy-2: #102231;
  --cream: #efe6d6;
  --muted: #a99f90;
  --red: #d62828;
  --line: rgba(239, 230, 214, 0.14);
  --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--navy); color: var(--cream); font-family: var(--body); }
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }

.header {
  position: fixed; inset: 0 0 auto 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 16px clamp(16px, 4vw, 48px);
  background: linear-gradient(to bottom, rgba(11, 22, 34, 0.88), rgba(11, 22, 34, 0));
}
.header__mark img { width: clamp(120px, 14vw, 176px); }
.header__nav { display: flex; gap: clamp(12px, 2.4vw, 32px); }
.header__nav a {
  text-decoration: none; font-size: 12px; letter-spacing: 0.24em;
  padding-bottom: 4px; border-bottom: 1px solid transparent; transition: color .25s, border-color .25s;
}
.header__nav a:hover { color: var(--red); border-bottom-color: var(--red); }
@media (max-width: 640px) { .header__nav { display: none; } }

/* Journey: scroll drives the film */
.journey { position: relative; height: 420vh; }
.journey__stage { position: sticky; top: 0; height: 100vh; overflow: hidden; background: var(--navy); }
.journey__stage video, .journey__stage .journey__poster {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
}
.journey__shade { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(11,22,34,0) 40%, rgba(11,22,34,0.55) 100%); pointer-events: none; }
.journey__copy {
  position: absolute; left: clamp(20px, 6vw, 96px); bottom: clamp(48px, 12vh, 140px);
  max-width: 80vw; transition: opacity .5s ease;
}
.journey__kicker { margin: 0 0 10px; font-size: 12px; letter-spacing: 0.42em; color: var(--muted); }
.journey__title {
  margin: 0; font-family: var(--display); font-weight: 700; line-height: 1.05;
  font-size: clamp(56px, 11vw, 150px); letter-spacing: 0.08em; text-wrap: balance;
  text-shadow: 0 6px 40px rgba(0, 0, 0, 0.6);
}
.journey__title--date { font-size: clamp(40px, 7vw, 96px); letter-spacing: 0.12em; }
.journey__copy--end { opacity: 0; }
.journey__hint {
  position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
  font-size: 11px; letter-spacing: 0.36em; color: var(--muted); transition: opacity .4s;
}

.section { padding: clamp(80px, 12vw, 160px) clamp(16px, 5vw, 72px); border-top: 1px solid var(--line); }
.heading {
  margin: 0 0 clamp(28px, 4vw, 56px); font-family: var(--display); font-weight: 700;
  font-size: clamp(24px, 3.6vw, 44px); letter-spacing: 0.24em;
}

.artist__main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: clamp(12px, 2vw, 24px); align-items: end; max-width: 1100px; }
.artist__main figure { margin: 0; border: 1px solid var(--line); background: var(--navy-2); }
.artist__main img { width: 100%; }
.artist__name { margin: 20px 0 0; font-family: var(--display); font-size: clamp(24px, 3vw, 40px); letter-spacing: 0.16em; }
.artist__subs { display: flex; gap: 12px; margin-top: clamp(40px, 6vw, 72px); }
.sub { margin: 0; width: clamp(92px, 11vw, 136px); }
.sub img { border: 1px solid var(--line); opacity: 0.9; }
.sub figcaption { margin-top: 8px; color: var(--muted); font-size: 11px; letter-spacing: 0.24em; }
@media (max-width: 720px) { .artist__main { grid-template-columns: 1fr; } }

.mv { background: var(--navy-2); }
.mv__screen { aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); }
.mv__screen video { width: 100%; height: 100%; display: block; }
.mv__caption { margin: 16px 0 0; color: var(--muted); font-size: 13px; letter-spacing: 0.16em; }

.release { display: flex; flex-direction: column; align-items: center; text-align: center; }
.release .heading { align-self: stretch; text-align: left; }
.release__art { width: min(560px, 100%); box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5); }
.release__date {
  margin: clamp(28px, 4vw, 48px) 0 0; font-family: var(--display);
  font-size: clamp(22px, 2.8vw, 36px); letter-spacing: 0.26em;
  padding-bottom: 10px; border-bottom: 2px solid var(--red);
}
.release__listen {
  margin-top: 28px; display: inline-block; padding: 14px 34px; text-decoration: none;
  font-size: 13px; letter-spacing: 0.32em; border: 1px solid var(--red);
  background: rgba(214, 40, 40, 0.14); transition: background .25s;
}
.release__listen:hover { background: var(--red); }

.footer { padding: 40px clamp(16px, 5vw, 72px); border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; letter-spacing: 0.2em; }

@media (prefers-reduced-motion: reduce) {
  .journey { height: auto; }
  .journey__stage { position: relative; }
  .journey__copy, .journey__hint, .header__nav a, .release__listen { transition: none; }
}
</style>
</head>
<body>
<header class="header">
  <a class="header__mark" href="#top" aria-label="パンクちゃん トップへ"><img src="img/logo-name.png" alt="パンクちゃん PUNK CHAN" width="352" height="110"></a>
  <nav class="header__nav" aria-label="サイト内メニュー">
    <a href="#artist">ARTIST</a>
    <a href="#mv">MUSIC VIDEO</a>
    <a href="#release">RELEASE</a>
  </nav>
</header>

<main id="top">
  <section class="journey" id="journey" aria-label="リリィ">
    <div class="journey__stage">
      <img class="journey__poster" src="img/film-poster.jpg" alt="" aria-hidden="true">
      <video id="film" muted playsinline preload="none" aria-hidden="true"></video>
      <div class="journey__shade"></div>
      <div class="journey__copy" id="copyStart">
        <p class="journey__kicker">DEBUT SINGLE</p>
        <h1 class="journey__title">リリィ</h1>
      </div>
      <div class="journey__copy journey__copy--end" id="copyEnd" aria-hidden="true">
        <p class="journey__kicker">2026.11.14</p>
        <p class="journey__title journey__title--date">OUT NOW</p>
      </div>
      <p class="journey__hint" id="hint">SCROLL</p>
    </div>
  </section>

  <section class="section artist" id="artist" aria-labelledby="artist-title">
    <h2 class="heading" id="artist-title">ARTIST</h2>
    <div class="artist__main">
      <figure><img src="img/lily-black.jpg" alt="パンクちゃん" loading="lazy"></figure>
      <figure><img src="img/lily-white.jpg" alt="パンクちゃん" loading="lazy"></figure>
    </div>
    <p class="artist__name">パンクちゃん</p>
    <div class="artist__subs">
      <figure class="sub"><img src="img/siesta.jpg" alt="Siesta" loading="lazy"><figcaption>Siesta</figcaption></figure>
      <figure class="sub"><img src="img/insomnia.jpg" alt="Insomnia" loading="lazy"><figcaption>Insomnia</figcaption></figure>
    </div>
  </section>

  <section class="section mv" id="mv" aria-labelledby="mv-title">
    <h2 class="heading" id="mv-title">MUSIC VIDEO</h2>
    <div class="mv__screen">
      <video id="mvPlayer" controls playsinline preload="none" poster="img/mv-poster.jpg" aria-label="パンクちゃん リリィ Official Music Video"></video>
    </div>
    <p class="mv__caption">リリィ Official Music Video</p>
  </section>

  <section class="section release" id="release" aria-labelledby="release-title">
    <h2 class="heading" id="release-title">RELEASE</h2>
    <div class="release__art"><img src="img/jacket.jpg" alt="パンクちゃん リリィ ジャケット" width="1254" height="1254" loading="lazy"></div>
    <p class="release__date">OUT NOW</p>
    <a class="release__listen" href="https://lnk.to/UpPrseD8">LISTEN NOW</a>
  </section>
</main>

<footer class="footer"><p>© パンクちゃん</p></footer>

<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---- Journey: scroll position drives the film ---- */
  var journey = document.getElementById("journey");
  var film = document.getElementById("film");
  var startCopy = document.getElementById("copyStart");
  var endCopy = document.getElementById("copyEnd");
  var hint = document.getElementById("hint");
  var ready = false, target = 0, ticking = false;

  function progress() {
    var r = journey.getBoundingClientRect();
    var span = journey.offsetHeight - window.innerHeight;
    if (span <= 0) return 0;
    return Math.min(1, Math.max(0, -r.top / span));
  }
  function apply() {
    ticking = false;
    var p = progress();
    startCopy.style.opacity = p < 0.12 ? 1 : Math.max(0, 1 - (p - 0.12) / 0.1);
    var e = p > 0.82 ? Math.min(1, (p - 0.82) / 0.1) : 0;
    endCopy.style.opacity = e;
    endCopy.setAttribute("aria-hidden", e > 0.5 ? "false" : "true");
    hint.style.opacity = p > 0.03 ? 0 : 1;
    if (ready && film.duration) {
      target = p * (film.duration - 0.05);
      if (Math.abs(film.currentTime - target) > 0.02) film.currentTime = target;
    }
  }
  function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(apply); } }

  if (!reduce) {
    fetch("media/film.mp4").then(function (r) { return r.blob(); }).then(function (b) {
      film.src = URL.createObjectURL(b);
      film.addEventListener("loadeddata", function () {
        ready = true; film.pause(); apply();
        film.previousElementSibling && (film.previousElementSibling.style.visibility = "hidden");
      }, { once: true });
      film.load();
    }).catch(function () {});
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
  }
  apply();

  /* ---- Music video: native HLS where supported, otherwise Media Source ---- */
  var mv = document.getElementById("mvPlayer");
  var MIME = 'video/mp4; codecs="avc1.64001f, mp4a.40.2"';
  var started = false;
  function startMV() {
    if (started) return; started = true;
    var MS = window.ManagedMediaSource || window.MediaSource;
    if (!MS || !MS.isTypeSupported || !MS.isTypeSupported(MIME)) { mv.src = "media/mv-lite.mp4"; return; }
    var ms = new MS();
    mv.disableRemotePlayback = true;
    mv.src = URL.createObjectURL(ms);
    ms.addEventListener("sourceopen", function () {
      var sb;
      try { sb = ms.addSourceBuffer(MIME); } catch (e) { mv.src = "media/mv-lite.mp4"; return; }
      var segs = ["init.mp4", "seg0.mp4", "seg1.mp4", "seg2.mp4", "seg3.mp4", "seg4.mp4"];
      var i = 0;
      function next() {
        if (i >= segs.length) { try { ms.endOfStream(); } catch (e) {} return; }
        fetch("media/mv/" + segs[i++]).then(function (r) {
          if (!r.ok) throw new Error(r.status); return r.arrayBuffer();
        }).then(function (buf) {
          sb.addEventListener("updateend", next, { once: true });
          sb.appendBuffer(buf);
        }).catch(function () { if (i <= 1) mv.src = "media/mv-lite.mp4"; });
      }
      next();
    }, { once: true });
  }
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (es, ob) {
      es.forEach(function (e) { if (e.isIntersecting) { startMV(); ob.disconnect(); } });
    }, { rootMargin: "400px" }).observe(mv);
  } else { startMV(); }
  mv.addEventListener("play", startMV);
})();
</script>
</body>
</html>
